name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --version
      - run: pnpm check
        if: matrix.os != 'macos-15'

      # Type-aware oxlint (tsgolint) crashes on macOS runners; ubuntu and windows
      # still run the full `pnpm check`, so the rule set stays enforced.
      - name: Check without type-aware oxlint
        if: matrix.os == 'macos-15'
        run: pnpm format:check && pnpm typecheck

      - name: Verify release contracts without credentials
        if: matrix.os == 'macos-15'
        run: ./scripts/test-release.sh

      - name: Verify generated schema is committed
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pnpm generate:schema
          pnpm exec oxfmt mcporter.schema.json
          git diff --exit-code -- mcporter.schema.json

      - name: Build docs site
        if: matrix.os == 'ubuntu-latest'
        run: pnpm docs:site

      - run: pnpm build

      - name: Pack npm artifact
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack --pack-destination /tmp

      - run: pnpm test
        if: matrix.os != 'ubuntu-latest'
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test

      # Coverage runs on one platform only: the thresholds in vitest.config.ts are
      # platform-independent, and instrumenting all three would triple CI time for
      # no extra signal. This still runs the whole suite, so ubuntu loses nothing.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test

      - name: Summarize coverage
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  deepwiki-cli:
    name: DeepWiki standalone CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Activate pnpm and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate and compile DeepWiki CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deepwiki-cli
          DEFINITION='{"name":"deepwiki","description":"CLI for DeepWiki public repository documentation and question answering","command":"https://mcp.deepwiki.com/mcp"}'
          pnpm exec tsx src/cli.ts generate-cli \
            --server "$DEFINITION" \
            --output deepwiki-cli/deepwiki.ts \
            --bundle deepwiki-cli/deepwiki.bundle.js \
            --compile deepwiki-cli/deepwiki-linux-x64 \
            --runtime bun \
            --bundler bun \
            --timeout 120000 \
            --minify
          bun build deepwiki-cli/deepwiki.bundle.js \
            --compile \
            --target bun-linux-x64-baseline \
            --outfile deepwiki-cli/deepwiki-linux-x64-baseline
          chmod 0755 deepwiki-cli/deepwiki-linux-x64 deepwiki-cli/deepwiki-linux-x64-baseline

      - name: Verify live endpoint
        shell: bash
        run: |
          set -euo pipefail
          bun --version | tee deepwiki-cli/BUN_VERSION
          ./deepwiki-cli/deepwiki-linux-x64 --help | tee deepwiki-cli/HELP.txt
          ./deepwiki-cli/deepwiki-linux-x64 read_wiki_structure \
            --repo-name openclaw/mcporter \
            --output json \
            | tee deepwiki-cli/SMOKE_TEST.json
          ./deepwiki-cli/deepwiki-linux-x64-baseline --help >/dev/null
          sha256sum \
            deepwiki-cli/deepwiki-linux-x64 \
            deepwiki-cli/deepwiki-linux-x64-baseline \
            deepwiki-cli/deepwiki.bundle.js \
            deepwiki-cli/deepwiki.ts \
            > deepwiki-cli/SHA256SUMS
          printf '%s\n' \
            'DeepWiki CLI generated from https://mcp.deepwiki.com/mcp' \
            '' \
            'Commands:' \
            '  deepwiki read_wiki_structure --repo-name owner/repo' \
            '  deepwiki read_wiki_contents --repo-name owner/repo' \
            '  deepwiki ask_question --repo-name owner/repo --question "How does it work?"' \
            '' \
            'Global output formats:' \
            '  --output text|markdown|json|raw' \
            '' \
            'No authentication is required for public repositories.' \
            > deepwiki-cli/README.txt

      - name: Upload DeepWiki CLI
        uses: actions/upload-artifact@v6
        with:
          name: deepwiki-cli-linux-x64
          path: deepwiki-cli/
          retention-days: 1
          if-no-files-found: error
