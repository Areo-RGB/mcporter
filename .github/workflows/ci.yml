name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-offline-kit:
    name: Flutter offline desktop kit (Debian 13 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune --all --force || true
          df -h

      - name: Build and verify offline kit
        shell: bash
        run: |
          chmod +x scripts/chatgpt-build-flutter-offline-kit.sh
          ./scripts/chatgpt-build-flutter-offline-kit.sh flutter-offline-output
          cat flutter-offline-output/OUTPUT_FILES.txt
          df -h

      - name: Upload metadata and reports
        uses: actions/upload-artifact@v6
        with:
          name: flutter-offline-kit-meta
          path: |
            flutter-offline-output/flutter-offline-kit-meta.tar.zst
            flutter-offline-output/OUTPUT_FILES.txt
            flutter-offline-output/FLUTTER_VERSION.txt
            flutter-offline-output/FLUTTER_DOCTOR.txt
            flutter-offline-output/OFFLINE_VERIFICATION.txt
            flutter-offline-output/DEBIAN13_INSTALLED_PACKAGE_MANIFEST.tsv
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload SDK part 000
        uses: actions/upload-artifact@v6
        with: &part
          name: flutter-sdk-part-000
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-000
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload SDK part 001
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-001
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-001
      - name: Upload SDK part 002
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-002
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-002
      - name: Upload SDK part 003
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-003
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-003
      - name: Upload SDK part 004
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-004
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-004
      - name: Upload SDK part 005
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-005
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-005
      - name: Upload SDK part 006
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-006
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-006
      - name: Upload SDK part 007
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-sdk-part-007
          path: flutter-offline-output/flutter-sdk-3.44.8-linux-x64-debian13.tar.zst.part-007

      - name: Upload pub cache part 000
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-pub-cache-part-000
          path: flutter-offline-output/flutter-pub-cache-3.44.8-desktop.tar.zst.part-000
      - name: Upload pub cache part 001
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-pub-cache-part-001
          path: flutter-offline-output/flutter-pub-cache-3.44.8-desktop.tar.zst.part-001
      - name: Upload pub cache part 002
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-pub-cache-part-002
          path: flutter-offline-output/flutter-pub-cache-3.44.8-desktop.tar.zst.part-002

      - name: Upload native deps part 000
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-native-debs-part-000
          path: flutter-offline-output/flutter-native-debs-debian13-amd64.tar.zst.part-000
      - name: Upload native deps part 001
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-native-debs-part-001
          path: flutter-offline-output/flutter-native-debs-debian13-amd64.tar.zst.part-001
      - name: Upload native deps part 002
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-native-debs-part-002
          path: flutter-offline-output/flutter-native-debs-debian13-amd64.tar.zst.part-002

      - name: Upload samples part 000
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-samples-part-000
          path: flutter-offline-output/flutter-desktop-samples-3.44.8.tar.zst.part-000
      - name: Upload samples part 001
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-samples-part-001
          path: flutter-offline-output/flutter-desktop-samples-3.44.8.tar.zst.part-001
      - name: Upload samples part 002
        uses: actions/upload-artifact@v6
        with:
          <<: *part
          name: flutter-samples-part-002
          path: flutter-offline-output/flutter-desktop-samples-3.44.8.tar.zst.part-002
