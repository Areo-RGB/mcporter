name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-debs:
    name: Debian 13 runtime compatibility packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned runtime packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime-debs
          cd runtime-debs
          curl --fail --location --retry 5 -O 'https://ftp.debian.org/debian/pool/main/g/glibc/libc6_2.41-12%2Bdeb13u3_amd64.deb'
          curl --fail --location --retry 5 -O 'https://ftp.debian.org/debian/pool/main/g/glibc/libc-bin_2.41-12%2Bdeb13u3_amd64.deb'
          curl --fail --location --retry 5 -O 'https://ftp.debian.org/debian/pool/main/s/systemd/libsystemd0_257.13-1~deb13u1_amd64.deb'
          curl --fail --location --retry 5 -O 'https://ftp.debian.org/debian/pool/main/x/xz-utils/liblzma5_5.8.1-1%2Bdeb13u1_amd64.deb'
          curl --fail --location --retry 5 -O 'https://ftp.debian.org/debian/pool/main/libc/libcap2/libcap2_2.75-10%2Bdeb13u1%2Bb1_amd64.deb'
          for file in *.deb; do dpkg-deb --info "$file" | sed -n '1,20p'; done
          sha256sum *.deb > SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: flutter-debian13-runtime-debs
          path: runtime-debs/
          retention-days: 1
          if-no-files-found: error
