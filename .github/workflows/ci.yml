name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-offline-kit:
    name: Flutter offline desktop kit (Debian 13 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune --all --force || true
          df -h

      - name: Build and verify offline kit
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/chatgpt-build-flutter-offline-kit.sh
          ./scripts/chatgpt-build-flutter-offline-kit.sh flutter-offline-output 2>&1 | tee flutter-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-build-log
          path: flutter-build.log
          retention-days: 1
          if-no-files-found: error
