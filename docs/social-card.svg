<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" role="img" viewBox="0 0 1200 630"><title id="title">mcporter social card</title><desc id="desc">mcporter: MCP, made portable. TypeScript runtime, CLI, and code-generation toolkit for the Model Context Protocol.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0a0c12"/><stop offset=".55" stop-color="#10131c"/><stop offset="1" stop-color="#0c0f17"/></linearGradient><linearGradient id="brandSweep" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".45" stop-color="#06b6d4"/><stop offset=".85" stop-color="#10b981"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><linearGradient id="logoGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0e121b"/><stop offset="1" stop-color="#070a10"/></linearGradient><linearGradient id="panelBar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1a1f2c"/><stop offset="1" stop-color="#0f131c"/></linearGradient><radialGradient id="haze" cx=".18" cy=".22" r=".6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/><stop offset=".6" stop-color="#06b6d4" stop-opacity=".08"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="22" flood-color="#000" flood-opacity=".55" stdDeviation="34"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#haze)"/><rect width="1200" height="6" x="0" y="0" fill="url(#brandSweep)"/><g transform="translate(76 76)"><rect width="118" height="118" x="0" y="0" fill="url(#logoGrad)" rx="24"/><rect width="74" height="56" x="22" y="42" fill="#0a0c12" rx="8"/><rect width="38" height="16" x="40" y="28" fill="#0a0c12" rx="4"/><rect width="74" height="3" x="22" y="58" fill="rgba(255,255,255,0.18)"/><circle cx="59" cy="74" r="6" fill="#a78bfa"/></g><text x="76" y="276" fill="#f5f7fb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="100" font-weight="800" letter-spacing="-1">mcporter</text><text x="80" y="338" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" letter-spacing="0">MCP, made portable.</text><text x="80" y="386" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">TypeScript runtime + CLI for the Model Context Protocol.</text><text x="80" y="414" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">Discover, call, and generate clients for any MCP server.</text><rect width="280" height="4" x="80" y="440" fill="url(#brandSweep)" rx="2"/><g transform="translate(80 478)"><rect width="320" height="48" x="0" y="0" fill="#0e121b" stroke="#1f2937" rx="11"/><text x="20" y="32" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500">$</text><text x="42" y="32" fill="#e6edf3" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">npx mcporter list</text><rect width="180" height="48" x="340" y="0" fill="#0e121b" stroke="#1f2937" rx="11"/><text x="362" y="32" fill="#a78bfa" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">mcporter.sh</text></g><g filter="url(#shadow)" transform="translate(670 142)"><rect width="464" height="346" x="0" y="0" fill="url(#panel)" stroke="#1b2030" rx="20"/><rect width="464" height="42" x="0" y="0" fill="url(#panelBar)" rx="20"/><rect width="464" height="20" x="0" y="22" fill="url(#panelBar)"/><circle cx="24" cy="21" r="6" fill="#ec4899"/><circle cx="46" cy="21" r="6" fill="#f59e0b"/><circle cx="68" cy="21" r="6" fill="#10b981"/><text x="232" y="27" fill="#94a3b8" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" text-anchor="middle">mcporter — agent ready</text><text x="22" y="80" fill="#a78bfa" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">$ npx mcporter list linear</text><text x="22" y="108" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">/**</text><text x="22" y="126" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">* Create a comment on a Linear issue</text><text x="22" y="144" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">* @param issueId The issue ID</text><text x="22" y="162" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">* @param body Markdown comment body</text><text x="22" y="180" fill="#64748b" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">*/</text><text x="22" y="200" fill="#7dd3fc" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">function</text><text x="100" y="200" fill="#fde68a" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">create_comment</text><text x="226" y="200" fill="#cbd5e1" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">(issueId, body);</text><text x="22" y="234" fill="#a78bfa" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">$ mcporter call linear.create_comment \\</text><text x="36" y="252" fill="#cbd5e1" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">issueId:ENG-123 body:&apos;lgtm&apos;</text><rect width="420" height="60" x="22" y="266" fill="#06090f" stroke="#1f2937" rx="10"/><text x="38" y="290" fill="#fbbf24" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">{</text><text x="54" y="308" fill="#a7f3d0" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">&quot;ok&quot;: true, &quot;comment&quot;: { &quot;id&quot;: &quot;abc123&quot; }</text><text x="38" y="326" fill="#fbbf24" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13">}</text></g><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600"><g transform="translate(670 514)"><rect width="92" height="30" x="0" y="0" fill="#0e121b" stroke="#262a36" rx="15"/><text x="46" y="20" fill="#a78bfa" text-anchor="middle">Runtime</text></g><g transform="translate(670 514) translate(104 0)"><rect width="56" height="30" x="0" y="0" fill="#0e121b" stroke="#262a36" rx="15"/><text x="28" y="20" fill="#06b6d4" text-anchor="middle">CLI</text></g><g transform="translate(670 514) translate(174 0)"><rect width="78" height="30" x="0" y="0" fill="#0e121b" stroke="#262a36" rx="15"/><text x="39" y="20" fill="#10b981" text-anchor="middle">OAuth</text></g><g transform="translate(670 514) translate(266 0)"><rect width="68" height="30" x="0" y="0" fill="#0e121b" stroke="#262a36" rx="15"/><text x="34" y="20" fill="#ec4899" text-anchor="middle">stdio</text></g><g transform="translate(670 514) translate(348 0)"><rect width="64" height="30" x="0" y="0" fill="#0e121b" stroke="#262a36" rx="15"/><text x="32" y="20" fill="#f59e0b" text-anchor="middle">HTTP</text></g></g></svg>